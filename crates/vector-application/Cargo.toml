[package]
name = "vector-application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vector-domain = { path = "../vector-domain" }
vector-study = { path = "../vector-study" }
vector-persistence = { path = "../vector-persistence" }
# Promoted from dev-dependencies: the application layer now orchestrates content
# generation, and it is the one place allowed to know both the pure question
# factory and the persistence layer. ARCHITECTURE.md puts use-case orchestration
# here and forbids pure layers from importing persistence.
vector-questions = { path = "../vector-questions" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
rusqlite.workspace = true
sha2.workspace = true
# The same version the domain layer signs a pack identity with, declared the same
# way that crate declares it. The pack engine loads a received signature into
# `vector_domain::content::ContentPack` and asks that type to verify it, so the
# signing payload has exactly one definition in the workspace.
ed25519-dalek = "3"
uuid.workspace = true

[dev-dependencies]
# The EP-007 property/fuzz and performance suites deliberately cross crate
# boundaries so the invariants are checked against the real implementations,
# not local copies.
vector-observability = { path = "../vector-observability" }
vector-platform = { path = "../vector-platform" }


