[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/vector-domain",
  "crates/vector-application",
  "crates/vector-persistence",
  "crates/vector-study",
  "crates/vector-content",
  "crates/vector-questions",
  "crates/vector-llm",
  "crates/vector-mcp",
  "crates/vector-observability",
  "crates/vector-repair",
  "crates/vector-platform",
  "tools/vector-tools"
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VECTOR Team"]
# Proprietary. `LicenseRef-` is SPDX's escape hatch for a licence that is not on
# the SPDX list, which is exactly the case here: the terms are in ./LICENSE and
# grant nothing. This replaced `MIT OR Apache-2.0`, which offered the code to
# anyone who looked while the repository was public.
license = "LicenseRef-Proprietary"
# Refuse `cargo publish`. A proprietary crate must not be publishable by
# accident, and crates.io would make it public permanently.
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.1.0" }
tauri-build = { version = "2.0.0" }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
clap = { version = "4.5", features = ["derive"] }
# Used by crash redaction to recognize credential shapes that appear in values
# (bearer tokens, API-key prefixes, private-key blocks). A key-name-only
# redactor cannot catch these.
regex = "1.11"
